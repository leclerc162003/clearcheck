<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1a1f27"><title>ClearCheck | Three-tab browser showcase</title><meta name="description" content="Three interactive ClearCheck concepts in one browser-style presentation demo.">
<style>/* ClearCheck integrated browser — interface shell only. Child prototypes retain their own styles. */
:root { color-scheme:dark; --shell:#151920; --top:#1d222a; --bar:#232933; --edge:#363d49; --txt:#f6f8fb; --dim:#a6afbc; --blue:#6ea4fa; --height:100dvh }
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#0c1017;color:var(--txt);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #77b2ff;outline-offset:2px}button:disabled{cursor:default;opacity:.35}
.browser{width:100%;height:var(--height);display:flex;flex-direction:column;overflow:hidden;background:var(--shell)}
.browser-top{height:50px;min-height:50px;background:#1a1f27;display:flex;align-items:end;gap:16px;padding:7px 18px 0;border-bottom:1px solid #29303a}
.window-controls{display:flex;align-items:center;gap:8px;padding-bottom:14px;flex:none}.dot{width:11px;height:11px;border-radius:50%;background:#ff605a}.dot:nth-child(2){background:#ffbd44}.dot:nth-child(3){background:#00ca4e}
.tab-list{display:flex;align-items:stretch;gap:5px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none}.tab-list::-webkit-scrollbar{display:none}
.browser-tab{height:41px;min-width:155px;max-width:240px;flex:1;display:flex;align-items:center;justify-content:flex-start;gap:10px;padding:0 13px 0 14px;border-radius:11px 11px 0 0;border:1px solid transparent;border-bottom:0;background:#202630;color:#acb6c4;position:relative;transition:background .16s ease,color .16s ease;white-space:nowrap}
.browser-tab:hover{background:#2a313d;color:#f5f7fb}.browser-tab[aria-selected="true"]{background:#303742;color:#fff;border-color:#414956;box-shadow:inset 0 2px 0 #74a8ff}.browser-tab[aria-selected="true"]:after{content:"";height:1px;position:absolute;bottom:-1px;left:0;right:0;background:#303742}.browser-tab .tab-icon{height:19px;width:19px;flex:none;display:grid;place-items:center}.browser-tab .tab-icon svg{width:18px;height:18px}.tab-title{overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:650;letter-spacing:-.05px;min-width:0}.tab-indicator{margin-left:auto;width:6px;height:6px;flex:none;background:#5e9cf7;border-radius:50%;opacity:0}.browser-tab[aria-selected=true] .tab-indicator{opacity:1}
.tab-new{align-self:center;width:31px;height:31px;margin-bottom:5px;border:none;border-radius:9px;color:#8492a6;background:transparent;display:grid;place-items:center;flex:none}.tab-new:hover{background:#353d48;color:#fff}
.browser-toolbar{height:52px;min-height:52px;background:#303742;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #1d2633}
.toolgroup{display:flex;align-items:center;gap:5px;flex:none}.tool{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:9px;background:transparent;color:#cbd3dd}.tool:hover:not(:disabled){background:#46505f;color:#fff}.tool svg{width:17px;height:17px}
.address-wrap{min-width:0;flex:1;display:flex;align-items:center;gap:10px;background:#20262f;border:1px solid #3c4654;border-radius:24px;padding:0 14px;height:36px;color:#c8d0dc}.address-wrap svg{width:15px;height:15px;flex:none;color:#78d0ae}.address{font-size:12px;letter-spacing:.1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;color:#e9edf5}.address .host{font-weight:720;color:#fff}.address .path{color:#aebbc9}
.demo-label{display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:10px;letter-spacing:1.1px;font-weight:800;color:#b9c6d8}.demo-label .pulse{background:#78aaf7;width:7px;height:7px;border-radius:50%;box-shadow:0 0 12px #5c9dff65}
.browser-viewport{position:relative;flex:1;min-height:0;background:#101319;isolation:isolate}.app-frame{position:absolute;inset:0;width:100%;height:100%;display:none;border:0;background:#101319}.app-frame.active{display:block}.shell-status{position:absolute;z-index:5;right:13px;bottom:13px;background:#121820eb;color:#c7d3df;border:1px solid #3c4958;border-radius:10px;padding:10px 13px;box-shadow:0 10px 35px #0007;font-size:12px;max-width:min(330px,80vw);display:none}.shell-status.show{display:block}
.browser-footer{height:28px;min-height:28px;background:#171e28;display:flex;align-items:center;justify-content:space-between;padding:0 15px;gap:10px;color:#8996a8;font-size:10px;letter-spacing:.13px}.browser-footer b{color:#b6c4d5;font-weight:620}.shortcuts{opacity:.8}
@media(max-width:900px){.browser-top{gap:9px;padding-inline:12px}.window-controls{gap:5px}.dot{width:9px;height:9px}.browser-tab{min-width:125px;padding-inline:11px}.tab-title{font-size:11px}.browser-toolbar{padding-inline:9px;gap:6px}.demo-label{font-size:9px;letter-spacing:.6px}}
@media(max-width:610px){.browser-top{height:54px;min-height:54px;align-items:end;padding:5px 6px 0;gap:0}.window-controls{display:none}.tab-list{gap:3px}.browser-tab{height:43px;min-width:116px;max-width:none;padding:0 9px;gap:6px}.browser-tab .tab-icon,.browser-tab .tab-icon svg{width:16px;height:16px}.tab-title{font-size:10px}.tab-indicator{width:5px;height:5px}.tab-new{display:none}.browser-toolbar{height:47px;min-height:47px;gap:4px}.tool{width:25px;height:30px}.toolgroup{gap:0}.tool svg{width:14px;height:14px}.address-wrap{height:33px;padding:0 10px;gap:7px}.address{font-size:10px}.demo-label{display:none}.browser-footer{font-size:9px;padding-inline:9px;height:26px;min-height:26px}.shortcuts{display:none}}
@media(max-width:395px){.browser-tab{min-width:103px}.browser-tab .tab-icon{display:none}.browser-tab .tab-title{font-size:10px}}
@media(prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body>

<button id="tab-reels" class="browser-tab" role="tab" aria-selected="false" aria-controls="frame-reels" title="Social Media · Reels"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="m8 3 4 6M15 3l4 6M3 9h18"/><path d="m10 12 5 3-5 3z"/></svg></span><span class="tab-title">Social Media · Reels</span><span class="tab-indicator"></span></button>

</div><button class="tab-new" aria-label="New tab" title="Three components available"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></header>
<div class="browser-toolbar" aria-label="Browser controls"><div class="toolgroup">
<button class="tool" id="back" title="Previous tab (Alt + ←)" aria-label="Previous tab" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
<button class="tool" id="forward" title="Next tab (Alt + →)" aria-label="Next tab" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
<button class="tool" id="reload" title="Restart current tab" aria-label="Restart current tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.5 5.7"/><path d="M20 4v7h-7"/></svg></button>
<button class="tool" id="home" title="Go to ClearCheck home" aria-label="Go to ClearCheck home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-8h6v8"/></svg></button></div>
<div class="address-wrap" title="Demonstration address only — not a real public website"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><div class="address" id="address-text"><span class="host">clearcheck.demo</span><span class="path">/check-a-claim</span></div></div>
<div class="demo-label"><span class="pulse"></span>CLASSROOM SIMULATION</div>
<button class="tool" id="fullscreen" title="Fullscreen presentation" aria-label="Fullscreen presentation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div>
<main class="browser-viewport" aria-label="Three interactive application previews">
<iframe class="app-frame active" id="frame-check" title="ClearCheck verification website" data-source="apps/check.html" aria-hidden="false"></iframe>
<iframe class="app-frame " id="frame-reels" title="Social media Reels simulation" data-source="apps/reels.html" aria-hidden="true"></iframe>
<iframe class="app-frame " id="frame-chat" title="Forward-to-chat demonstration" data-source="apps/chat.html" aria-hidden="true"></iframe>
<div id="shell-status" class="shell-status" role="status" aria-live="polite"></div></main>
<footer class="browser-footer"><span><b>ClearCheck ecosystem</b> · Three independent interactive prototypes</span><span class="shortcuts">Switch tabs: Ctrl / ⌘ + 1–3</span></footer>
</div>

<script>(() => {
  'use strict';
  const TABS={
    check:{title:'ClearCheck • Verify',host:'clearcheck.demo',path:'/check-a-claim',name:'Verification website',payload:'payload-check'},
    reels:{title:'Reels • ClearCheck',host:'social.demo',path:'/reels',name:'Reels simulation',payload:'payload-reels'},
    chat:{title:'Messages • ClearCheck',host:'messages.demo',path:'/chats',name:'Forward-to-chat simulation',payload:'payload-chat'}
  };
  const ids=Object.keys(TABS),frames=Object.fromEntries(ids.map(k=>[k,document.getElementById('frame-'+k)]));
  const buttonEls=Object.fromEntries(ids.map(k=>[k,document.getElementById('tab-'+k)]));
  const address=document.getElementById('address-text');
  const back=document.getElementById('back'),forward=document.getElementById('forward');
  const status=document.getElementById('shell-status');
  const timeline=['check']; let position=0, current='check',statusTimer;
  function notify(msg){status.textContent=msg;status.classList.add('show');clearTimeout(statusTimer);statusTimer=setTimeout(()=>status.classList.remove('show'),2200)}
  function loadFrame(id,reload=false){
    const frame=frames[id];
    if(!frame.dataset.loaded||reload){
      const encoded=document.getElementById(TABS[id].payload);
      if(encoded){
        try{
          const chars=atob(encoded.textContent.replace(/\s/g,''));
          const bytes=Uint8Array.from(chars,c=>c.charCodeAt(0));
          frame.srcdoc=new TextDecoder('utf-8').decode(bytes);
        }catch(e){notify('Unable to load this demo tab'); console.error('Demo load error',e)}
      } else frame.src=frame.dataset.source;
      frame.dataset.loaded='true';
    }
  }
  function render(){
    ids.forEach(id=>{
      const selected=id===current;
      frames[id].classList.toggle('active',selected);
      frames[id].setAttribute('aria-hidden',String(!selected));
      buttonEls[id].setAttribute('aria-selected',String(selected));
      buttonEls[id].tabIndex=selected?0:-1;
    });
    const meta=TABS[current];address.innerHTML=`<span class="host">${meta.host}</span><span class="path">${meta.path}</span>`;
    document.title=meta.title+' | Browser showcase';
    back.disabled=position===0;forward.disabled=position===timeline.length-1;
  }
  function select(id,record=true){if(!TABS[id]||id===current)return;
    if(record){timeline.splice(position+1);timeline.push(id);position=timeline.length-1}
    current=id;loadFrame(id);render();
  }
  function go(delta){const dest=position+delta;if(dest<0||dest>=timeline.length)return;position=dest;current=timeline[position];loadFrame(current);render()}
  ids.forEach(id=>buttonEls[id].addEventListener('click',()=>select(id)));
  back.addEventListener('click',()=>go(-1));forward.addEventListener('click',()=>go(1));
  document.getElementById('reload').addEventListener('click',()=>{loadFrame(current,true);notify(TABS[current].name+' restarted')});
  document.getElementById('home').addEventListener('click',()=>select('check'));
  document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement) await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else notify('Fullscreen is not supported in this browser')}catch{notify('Fullscreen unavailable here')}});
  document.querySelector('.tab-new').addEventListener('click',()=>notify('All three ClearCheck components are already open'));
  document.querySelector('.address-wrap').addEventListener('click',()=>notify('Demo addresses are visual only — this browser shows three local prototypes'));
  document.addEventListener('keydown',e=>{
    const ctrl=e.ctrlKey||e.metaKey;
    if((ctrl&&(e.key==='Tab'))){e.preventDefault();select(ids[(ids.indexOf(current)+(e.shiftKey?-1:1)+ids.length)%ids.length]);return}
    if(ctrl&&['1','2','3'].includes(e.key)){e.preventDefault();select(ids[Number(e.key)-1]);return}
    if(ctrl&&e.key.toLowerCase()==='r'){e.preventDefault();loadFrame(current,true);notify('Tab restarted');return}
    if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();go(-1)}
    if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();go(1)}
  });
  loadFrame('check');render();
})();
</script></body></html>
